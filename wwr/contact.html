<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Goke-aina yewande sagoe | wdd130">
    <meta name="description"
      content="Contact White Rafting Waters for rafting reservations, questions, and information about our river adventures.">
    <title>Contact Us - White Rafting Waters</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>

        <img src="/wwr/images/splash.png" alt="splash Rafting logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html" target="_parent" rel="opener">Home</a></li>
                <li><a href="about.html" target="_parent" rel="opener">about</a></li>
                <li><a href="trips.html" target="_parent" rel="opener">trips</a></li>
                <li><a href="contact.html" target="_parent" rel="opener">contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <section class="contact-info">
            <div class="company-info">
                <h2>White Rafting Waters</h2>

                <p>123 River Road, Adventure City</p>
                <p>Phone: +1 555-123-4567</p>
                <p>Email: info@whiteraftingwaters.com</p>
            </div>

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d63413.145869699896!2d3.34583795!3d6.6068985!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103b922c575152ad%3A0x45c0b87cf0ea40f9!2sLagos%20101233%2C%20Lagos!5e0!3m2!1sen!2sng!4v1790874899792!5m2!1sen!2sng"
              width="350" height="250" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
              title="White Rafting Waters location"></iframe>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <div class="employee-grid">

                <figure>
                    <img src="/wwr/images/rafting4.jpg" alt="White Rafting Waters manager">
                    <figcaption>Sarah James - General Manager</figcaption>
                </figure>

                <figure>
                    <img src="/wwr/images/rafting5.jpg" alt="White Rafting Waters rafting guide">
                    <figcaption>David Smith - Head Rafting Guide</figcaption>
                </figure>

                <figure>
                    <img src="/wwr/images/rafting22.jpg"
                      alt="White Rafting Waters reservation specialist">
                    <figcaption>Mary Jones - Reservation Specialist</figcaption>
                </figure>

            </div>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form>

                <label for="fullname">Name:</label>
                <input type="text" id="fullname" name="fullname">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <label>
                        <input type="radio" name="purpose" value="general">
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6"></textarea>

                <label class="newsletter">
                    <input type="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <footer>
        <p>Goke-aina yewande | 2026</p>
        <section class="socialmedia">
            <nav>

                <a href="https://web.facebook.com/" target="_blank" rel="noopener">
                    <img src="/wwr/images/facebook.svg" alt="facebook logo">
                </a>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener">
                    <img src="/wwr/images/instagram.svg" alt="instagram logo">
                </a>
                <a href="https://www.linkedin.com/" target="_blank" rel="noopener">
                    <img src="/wwr/images/linkedin.svg" alt="linkedin logo">
                </a>

            </nav>
        </section>
    </footer>

</body>

</html>
